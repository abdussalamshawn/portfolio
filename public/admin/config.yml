backend:
  name: github
  repo: abdussalamshawn/portfolio
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: writing
    label: Writing
    folder: src/data/writing
    create: true
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Text, name: body, widget: markdown }
